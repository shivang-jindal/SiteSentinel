name: Feature Request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting! Describe the feature and why it's useful."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: "What problem does this solve?"
    required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: "How should it work?"
    required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: "Other approaches?"
    required: false
  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution
      options:
        - label: "I can implement this"
          required: false
        - label: "I can test this"
          required: false